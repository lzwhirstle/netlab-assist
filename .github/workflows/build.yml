name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: netlab-assist-windows
          - os: macos-15
            artifact: netlab-assist-macos-arm64
          - os: macos-15-intel
            artifact: netlab-assist-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Package standalone application
        shell: bash
        run: >-
          python -m PyInstaller
          --name netlab-assist
          --onefile
          --collect-data netlab_assist
          --add-data "src/netlab_assist/web:netlab_assist/web"
          --paths src
          run.py
      - name: Re-sign macOS standalone executable
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --force --deep --sign - dist/netlab-assist
      - name: Smoke-test packaged application
        shell: bash
        run: python scripts/smoke_test_binary.py dist/netlab-assist*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/netlab-assist*
          if-no-files-found: error
