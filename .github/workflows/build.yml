name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: netlab-assist-windows
          - os: macos-14
            artifact: netlab-assist-macos-arm64
          - os: macos-13
            artifact: netlab-assist-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Package standalone application
        shell: bash
        run: >-
          python -m PyInstaller
          --name netlab-assist
          --onefile
          --collect-data netlab_assist
          --paths src
          run.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/netlab-assist*
          if-no-files-found: error
